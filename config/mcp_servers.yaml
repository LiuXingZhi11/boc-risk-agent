# MCP Provider 连接配置。真实密钥只从 auth_env 指定的环境变量读取。
# 首轮默认关闭；启用前先完成平台审核和单 Tool Smoke Test。
providers:
  qcc-company:
    provider: qcc
    transport: http
    url: https://agent.qcc.com/mcp/company/stream
    auth_env: QCC_API_KEY
    enabled: false

  qcc-risk:
    provider: qcc
    transport: http
    url: https://agent.qcc.com/mcp/risk/stream
    auth_env: QCC_API_KEY
    enabled: false

  qcc-ipr:
    provider: qcc
    transport: http
    url: https://agent.qcc.com/mcp/ipr/stream
    auth_env: QCC_API_KEY
    enabled: false
