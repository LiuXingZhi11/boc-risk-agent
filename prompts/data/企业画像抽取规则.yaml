# 企业画像抽取规则
#
# 本文件只负责“原始 PDF 证据如何转成结构化事实”。
# 字段含义、字段 ID、关系类型和枚举值仍以企业画像本体.yaml为准。

extraction_rules:
  - 只抽取原文直接支持的事实；无法确认时写入信息缺口，不得根据常识猜测。
  - 保留事实的主体、数值、单位、期间和统计范围；不同口径不得合并。
  - 企业自述、审计披露、监管认定和司法认定必须区分，未披露不等于不存在。
  - 证据摘录必须来自同一证据单元中的连续原文；表格事实同时引用表头或口径和数据行。
  - 同一主体、字段、期间和统计口径的重复事实只保留一项，并合并证据。

domain_guidance:
  team:
    - 关键人员字段用于形成公司整体团队画像，不是要求为所有出现的人员逐一建档；核心技术人员作为关键人员时必须有原文依据。
    - 团队概况字段应概括整体构成，不要逐人复制完整简历，也不要自行评价学历或经历优劣。
    - 多人物概括必须分别引用各人物证据；证据摘录必须保留连续原文，禁止使用省略号。
  outcome_and_resolution:
    - 当前领域只记录已经发生的结果或权威决定；相关事实的 content_role=outcome。
    - 结果事实必须保留决定主体、决定内容、发生时间和执行状态，不得把风险推测写成结果。
